<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora Studio — All our links</title>
<style>
:root{--bg:#04040c;--card:#10102a;--line:rgba(140,150,255,.18);--tx:#f2f3ff;--mut:#9a9ec8;--g:linear-gradient(135deg,#19d0ff,#3b6bff 45%,#9b4dff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 380px at 20% 0%,rgba(25,208,255,.18),transparent),radial-gradient(560px 420px at 85% 10%,rgba(155,77,255,.22),transparent)}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:2px solid #8fb0ff;outline-offset:2px}
.wrap{max-width:860px;margin:auto;padding:0 20px 60px}
.top{display:flex;justify-content:flex-end;gap:8px;padding:18px 0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:14px;transition:.2s}.pill:hover{border-color:#5d6bff;background:#181840}.pill.on{background:var(--g);border-color:transparent}
.hero{text-align:center;padding:10px 0 34px}
.hero img{width:118px;height:auto;filter:drop-shadow(0 0 34px rgba(80,110,255,.6));animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.hero h1{font-family:"Gill Sans","Trebuchet MS",sans-serif;font-size:clamp(34px,7vw,58px);letter-spacing:.12em;margin:18px 0 6px;font-weight:400}
.hero h1 b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.hero p{color:var(--mut);margin:0;letter-spacing:.08em}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:26px 0 22px}
.sec{margin:26px 0 10px;font-size:15px;color:var(--mut);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lk{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;text-decoration:none;color:inherit;transition:.25s;position:relative}
.lk:hover{transform:translateY(-4px);border-color:#6a78ff;box-shadow:0 12px 34px rgba(80,90,255,.28)}
.lk .ic{width:46px;height:46px;border-radius:15px;background:rgba(100,110,255,.16);display:grid;place-items:center;font-size:23px;flex:none;transition:.25s}
.lk:hover .ic{transform:scale(1.1) rotate(-4deg)}
.lk b{display:block}.lk small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .m{min-width:0;flex:1}.lk .go{color:var(--mut);transition:.25s}.lk:hover .go{color:#fff;transform:translateX(3px)}
.ed{background:var(--card);border:1px dashed #5d6bff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ed input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.ed .r{display:flex;gap:8px}.ed .r button{flex:1;background:#1c1c46;border-radius:12px;padding:8px}
.add{display:none;margin:22px 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.add.on{display:block}.add .r{display:flex;gap:8px;flex-wrap:wrap}.add input{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.empty{color:var(--mut);text-align:center;padding:30px}
footer{text-align:center;color:var(--mut);font-size:14px;margin-top:44px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:#1b1b3d;border:1px solid #4f7cff;padding:11px 20px;border-radius:99px;transition:.3s}.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
